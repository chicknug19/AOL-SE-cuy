name: Deploy Backend to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout GitHub Action
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x' 

      - name: Build with dotnet
        run: dotnet build "backend/backend.csproj" --configuration Release

      - name: Publish with dotnet
        run: dotnet publish "backend/backend.csproj" -c Release -o "${{ env.GITHUB_WORKSPACE }}/myapp"
        
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'bookugers-api-backend'
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: '${{ env.GITHUB_WORKSPACE }}/myapp'
